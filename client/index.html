<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spilio Studio</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body>

  <header class="studio-header">
    <img class="studio-logo" src="assets/logo-header.png" alt="Spilio">
    <span class="studio-word" id="studioWord" role="button" tabindex="0"
          title="Diagnostics">Studio</span>
  </header>

  <nav class="studio-tabs" role="tablist" aria-label="Spilio Studio modules">
    <button class="studio-tab" type="button" role="tab" data-tab="motion"
            aria-controls="frame-motion" aria-selected="false">Motion</button>
    <button class="studio-tab" type="button" role="tab" data-tab="tags"
            aria-controls="frame-tags" aria-selected="false">Tags</button>
    <button class="studio-tab" type="button" role="tab" data-tab="subs"
            aria-controls="frame-subs" aria-selected="false">Subs</button>
    <button class="studio-tab" type="button" role="tab" data-tab="org"
            aria-controls="frame-org" aria-selected="false">Org</button>
  </nav>

  <main class="studio-stage" id="stage">
    <div class="studio-pane" id="pane-motion" data-src="../panels/motion/index.html"></div>
    <div class="studio-pane" id="pane-tags"   data-src="../panels/tags/index.html"></div>
    <div class="studio-pane" id="pane-subs"   data-src="../panels/subs/index.html"></div>
    <div class="studio-pane" id="pane-org"    data-src="../panels/org/index.html"></div>
  </main>

  <div class="studio-diag hidden" id="diag">
    <div class="studio-diag-bar">
      <span class="studio-diag-title">Diagnostics</span>
      <button type="button" id="diagCopy">Copy</button>
      <button type="button" id="diagClose">Close</button>
    </div>
    <pre class="studio-diag-body" id="diagBody"></pre>
  </div>

  <div class="studio-fault hidden" id="fault">
    <p class="studio-fault-title" id="faultTitle"></p>
    <pre class="studio-fault-body" id="faultBody"></pre>
    <button class="studio-fault-retry" type="button" id="faultRetry">Retry</button>
  </div>

  <script src="shell.js"></script>
</body>
</html>
